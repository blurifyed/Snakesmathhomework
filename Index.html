
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE.EXE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    font-size: 42px;
    letter-spacing: 7px;
    color: #ff304f;
    margin-bottom: 8px;
    text-shadow: 0 0 18px #ff304f66;
}

.subtitle {
    color: #858997;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.stats {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
}

.stat {
    flex: 1;
    background: #151821;
    border: 1px solid #292e3b;
    border-radius: 12px;
    padding: 14px;
}

.stat p {
    font-size: 10px;
    color: #9095a3;
    letter-spacing: 2px;
}

.stat h2 {
    font-size: 26px;
    margin-top: 5px;
    color: #ff405e;
}

.board-wrapper {
    position: relative;
    background: #11141c;
    padding: 10px;
    border: 1px solid #ff304f55;
    border-radius: 15px;
    box-shadow: 0 0 30px #ff304f15;
}

canvas {
    width: 100%;
    display: block;
    background: #0a0d13;
    border-radius: 8px;
    image-rendering: pixelated;
}

.overlay {
    position: absolute;
    inset: 10px;
    background: #08090ddd;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    padding: 20px;
}

.overlay h2 {
    color: #ff405e;
    font-size: 30px;
    margin-bottom: 12px;
}

.overlay p {
    color: #b4b8c4;
    font-size: 14px;
    margin-bottom: 22px;
}

button {
    border: none;
    cursor: pointer;
    background: #ff304f;
    color: white;
    padding: 13px 27px;
    font-weight: bold;
    font-size: 13px;
    border-radius: 9px;
    transition: 0.2s;
}

button:hover {
    background: #ff5670;
    transform: translateY(-2px);
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
}

.controls button {
    background: #191e29;
    border: 1px solid #343b4c;
    min-width: 110px;
}

.dpad {
    margin: 20px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 55px);
    gap: 7px;
    justify-content: center;
}

.dpad button {
    padding: 14px 0;
    background: #191e29;
    border: 1px solid #343b4c;
    font-size: 18px;
}

.dpad button:active {
    background: #ff304f;
}

.empty {
    visibility: hidden;
}

.help {
    color: #777e8d;
    font-size: 11px;
    margin-top: 20px;
    line-height: 1.8;
}

@media (min-width: 700px) {
    .dpad {
        display: none;
    }
}
</style>
</head>

<body>

<main class="game">

    <h1>SNAKE.EXE</h1>
    <p class="subtitle">CLASSIC ARCADE EXPERIENCE</p>

    <div class="stats">
        <div class="stat">
            <p>SCORE</p>
            <h2 id="score">0</h2>
        </div>

        <div class="stat">
            <p>BEST</p>
            <h2 id="best">0</h2>
        </div>
    </div>

    <div class="board-wrapper">
        <canvas id="board" width="400" height="400"></canvas>

        <div class="overlay" id="overlay">
            <h2 id="message">SNAKE GAME</h2>
            <p id="description">
                Collect food. Grow longer. Don't crash.
            </p>
            <button id="startButton">START GAME</button>
        </div>
    </div>

    <div class="controls">
        <button id="pauseButton">PAUSE</button>
        <button id="restartButton">RESTART</button>
    </div>

    <div class="dpad">
        <span class="empty"></span>
        <button data-dir="up">▲</button>
        <span class="empty"></span>

        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
    </div>

    <p class="help">
        ARROW KEYS / WASD TO MOVE<br>
        SPACE TO PAUSE<br>
        COLLECT FOOD TO INCREASE YOUR SCORE
    </p>

</main>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const bestDisplay = document.getElementById("best");
const overlay = document.getElementById("overlay");
const message = document.getElementById("message");
const description = document.getElementById("description");

const GRID = 20;
const SIZE = 400;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;
let gameRunning = false;
let gameOver = false;
let lastTime = 0;
let accumulator = 0;
let speed = 110;

bestDisplay.textContent = best;

function resetGame() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};

    score = 0;
    speed = 110;
    accumulator = 0;

    updateScore();
    spawnFood();
    draw();
}

function spawnFood() {
    do {
        food = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID)
        };
    } while (
        snake.some(part =>
            part.x === food.x && part.y === food.y
        )
    );
}

function updateScore() {
    scoreDisplay.textContent = score;

    if (score > best) {
        best = score;
        localStorage.setItem("snakeBest", best);
        bestDisplay.textContent = best;
    }
}

function draw() {
    ctx.fillStyle = "#0a0d13";
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Grid
    ctx.strokeStyle = "#ffffff08";
    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 20, 0);
        ctx.lineTo(i * 20, SIZE);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * 20);
        ctx.lineTo(SIZE, i * 20);
        ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#ff405e";
    ctx.shadowColor = "#ff304f";
    ctx.shadowBlur = 15;

    ctx.beginPath();
    ctx.arc(
        food.x * 20 + 10,
        food.y * 20 + 10,
        7,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.shadowBlur = 0;

    // Snake
    snake.forEach((part, index) => {
        const padding = 2;

        ctx.fillStyle = index === 0
            ? "#ffffff"
            : "#39e98b";

        ctx.shadowColor = index === 0
            ? "#ffffff"
            : "#39e98b";

        ctx.shadowBlur = index === 0 ? 12 : 5;

        ctx.beginPath();
        ctx.roundRect(
            part.x * 20 + padding,
            part.y * 20 + padding,
            20 - padding * 2,
            20 - padding * 2,
            5
        );
        ctx.fill();
    });

    ctx.shadowBlur = 0;
}

function moveSnake() {
    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    const eating =
        head.x === food.x && head.y === food.y;

    // Wall collision
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= GRID ||
        head.y >= GRID
    ) {
        endGame();
        return;
    }

    // Self collision
    const bodyToCheck = eating
        ? snake
        : snake.slice(0, -1);

    if (
        bodyToCheck.some(part =>
            part.x === head.x && part.y === head.y
        )
    ) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score += 10;
        speed = Math.max(55, speed - 2);

        updateScore();
        spawnFood();
    } else {
        snake.pop();
    }

    draw();
}

function endGame() {
    gameRunning = false;
    gameOver = true;

    message.textContent = "GAME OVER";
    description.textContent =
        "Your final score: " + score;

    document.getElementById("startButton").textContent =
        "PLAY AGAIN";

    overlay.style.display = "flex";
}

function startGame() {
    if (gameOver) {
        resetGame();
    }

    gameRunning = true;
    gameOver = false;
    lastTime = 0;
    accumulator = 0;

    overlay.style.display = "none";
}

function togglePause() {
    if (gameOver) return;

    if (gameRunning) {
        gameRunning = false;

        message.textContent = "PAUSED";
        description.textContent = "Take a break.";
        document.getElementById("startButton").textContent =
            "RESUME";

        overlay.style.display = "flex";
    } else {
        startGame();
    }
}

function setDirection(x, y) {
    if (!gameRunning) return;

    // Prevent reversing into yourself
    if (
        x === -direction.x &&
        y === -direction.y
    ) {
        return;
    }

    nextDirection = {x, y};
}

document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    const controls = {
        arrowup: [0, -1],
        w: [0, -1],
        arrowdown: [0, 1],
        s: [0, 1],
        arrowleft: [-1, 0],
        a: [-1, 0],
        arrowright: [1, 0],
        d: [1, 0]
    };

    if (controls[key]) {
        event.preventDefault();
        setDirection(...controls[key]);
    }

    if (key === " ") {
        event.preventDefault();
        togglePause();
    }
});

// Mobile controls
document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("pointerdown", () => {
        const dirs = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0]
        };

        setDirection(...dirs[button.dataset.dir]);
    });
});

document.getElementById("startButton")
    .addEventListener("click", startGame);

document.getElementById("pauseButton")
    .addEventListener("click", togglePause);

document.getElementById("restartButton")
    .addEventListener("click", () => {
        resetGame();
        startGame();
    });

// Main game loop
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    const delta = Math.min(timestamp - lastTime, 100);
    lastTime = timestamp;

    if (gameRunning) {
        accumulator += delta;

        if (accumulator >= speed) {
            moveSnake();
            accumulator = 0;
        }
    }

    requestAnimationFrame(gameLoop);
}

// Initialize
resetGame();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
